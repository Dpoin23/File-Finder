[project]
name = "file-finder"
version = "0.1.0"
description = "Local search over folders and repositories by filename or description"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.4",
    "numpy>=1.26",
    "pathspec>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16.8",
]

[project.scripts]
ff = "filefinder.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["venv", ".venv", "bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501", # line length — diffs stay focused on real issues
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201"]
